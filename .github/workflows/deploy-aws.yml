name: Deploy AWS

# Se déclenche uniquement quand la CI est terminée sur main :
# équivalent d'un "needs" vers les jobs test / deps-audit / image de ci.yml
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    # Sans compte AWS ce job ne se lance pas (vars.AWS_ENABLED != 'true') :
    # il échouerait sinon à l'étape OIDC, et c'est normal.
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.AWS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC : des droits AWS temporaires, AUCUNE clé stockée
    steps:
      - uses: actions/checkout@v4

      # 1. Droits AWS temporaires via OIDC (rôle IAM trusté sur le repo GitHub)
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-oidc-deploy
          aws-region: eu-west-3

      # 2. Login ECR (utilise les credentials temporaires OIDC)
      - uses: aws-actions/amazon-ecr-login@v2

      # 3. Build + push de l'image taguée par le SHA du commit, jamais "latest"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-3.amazonaws.com/devsecops-tp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. Mise à jour du service ECS (rolling deploy de la nouvelle image)
      - name: Deployer sur ECS Fargate
        run: |
          aws ecs update-service \
            --cluster prod \
            --service devsecops-tp \
            --force-new-deployment \
            --region eu-west-3
